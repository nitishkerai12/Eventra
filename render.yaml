services:
  - type: web
    name: eventra
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        value: mongodb+srv://nitish:nitish12345@cluster0.6fr4tec.mongodb.net/eventraDEVV?appName=Cluster0
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
